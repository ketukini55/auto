<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08081a"/>
      <stop offset="100%" style="stop-color:#0f0f2e"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b82fc"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#7B5CFA;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7B5CFA;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Logo ghost icon -->
  <rect x="560" y="180" width="80" height="80" rx="20" fill="url(#grad)"/>
  <text x="600" y="236" font-size="40" text-anchor="middle" font-family="system-ui">👻</text>

  <!-- "boo" wordmark -->
  <text x="600" y="320" font-size="72" font-weight="900" text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" fill="url(#grad)">boo</text>

  <!-- Tagline -->
  <text x="600" y="376" font-size="28" text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" fill="#9899b8">
    Find your perfect match
  </text>

  <!-- Sub-tagline -->
  <text x="600" y="416" font-size="20" text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" fill="#9899b8">
    Personality-based matching · 10M+ members
  </text>

  <!-- Stat pills -->
  <rect x="348" y="450" width="140" height="44" rx="22" fill="rgba(123,92,250,0.18)" stroke="rgba(123,92,250,0.3)" stroke-width="1"/>
  <text x="418" y="478" font-size="16" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#9b82fc">4.8★ App Store</text>

  <rect x="530" y="450" width="140" height="44" rx="22" fill="rgba(255,107,157,0.18)" stroke="rgba(255,107,157,0.3)" stroke-width="1"/>
  <text x="600" y="478" font-size="16" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#FF6B9D">94% accuracy</text>

  <rect x="712" y="450" width="140" height="44" rx="22" fill="rgba(78,205,196,0.18)" stroke="rgba(78,205,196,0.3)" stroke-width="1"/>
  <text x="782" y="478" font-size="16" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#4ECDC4">16 types</text>
</svg>
